[tool.poetry]
name = "civagent"
version = "0.1.0"
description = "https://github.com/fuxiAIlab/CivAgent"
authors = ["ArthurWang <asdqsczser@gmail.com>"]
license = "MPL-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.3"
gevent = "^24.2.1"
httpx = "^0.27.0"
jpype1 = "^1.5.0"
redis = "^5.0.8"
requests = "^2.32.3"
discord = "^2.3.2"
werkzeug = "^3.0.3"
pyyaml = "^6.0.2"
pycryptodome = "^3.20.0"
ujson = "^5.10.0"
loguru = "^0.7.2"


[tool.poetry.group.llm.dependencies]
instructor = "^1.3.7"
llama-index = "^0.10.62"
openai = "^1.40.2"
pydantic = "^2.8.2"
llama-index-embeddings-ollama = "^0.1.3"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-bibtex = "^2.16.0"
mkdocs-material-extensions = "^1.3.1"
mkdocs-material = "^9.5.31"
mkdocs-git-revision-date-localized-plugin = "^1.2.6"
mkdocs-git-authors-plugin = "^0.9.0"
mkdocstrings-python = "^1.10.7"


[tool.poetry.group.developer.dependencies]
pre-commit = "^3.8.0"
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
hypothesis = "^6.110.1"
pytest-sugar = "^1.0.0"
isort = "^5.13.2"
flake8 = "^7.1.1"
black = "^24.8.0"
mypy = "^1.11.1"
ruff = "^0.5.7"
commitizen = "^3.28.0"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true
changelog_incremental = true


[virtualenvs]
create = true
in-project = true

[tool.mypy]
# 设置全局的配置
exclude = [".venv", "scripts/*", "civagent/civsim/jsons/*", "civsim/simulator/*"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120
exclude = [".venv", "scripts/*", "**/__init__.py", "civagent/civsim/jsons/*"]

[tool.coverage.report]
skip_empty = true
omit = [
    "*/__init__.py",
    "civagent/civsim/jsons/*",
]
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]


[[tool.poetry.source]]
name = "THU-PyPI"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"


[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"




[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
